name: Build site

# Builds the static site and publishes it to the "site" branch.
# The server pulls that branch every few minutes (deploy/add-site.sh), so no SSH keys are stored here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency: { group: build, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { NODE_OPTIONS: "--max-old-space-size=4096" }
      - name: SEO checks
        run: python3 scripts/check-seo.py
      - name: Publish to the "site" branch
        run: |
          cd dist
          git init -q -b site
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
          echo "Published $(find . -name index.html | wc -l) pages"

  indexnow:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: |
          sleep 330   # the server pulls the site branch every 5 minutes; wait so the key file and new pages are live
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r'<loc>([^<]+)</loc>', urllib.request.urlopen('https://raw.githubusercontent.com/${{ github.repository }}/site/sitemap.xml', timeout=30).read().decode())
          body = json.dumps({"host": "my3dprinter.io", "key": "4914a7e60617c47675286a2dca44e1b5", "keyLocation": "https://my3dprinter.io/4914a7e60617c47675286a2dca44e1b5.txt", "urlList": urls[:10000]}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("IndexNow:", urllib.request.urlopen(req, timeout=30).status, len(urls), "urls")
          except Exception as e:
              print("IndexNow failed:", e)
          PY
